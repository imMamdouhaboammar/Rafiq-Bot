name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full depth
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run P0 Test Suite
        run: npm run test:p0

      - name: Run Full Test Suite
        run: npm test

      - name: Run Security Scan
        run: npm run security:scan

      - name: Verify Production Build
        run: bun run build
