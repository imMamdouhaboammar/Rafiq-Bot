name: Complete Test Discovery

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: all-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Repository safety
        run: npm run security:scan

      - name: Run every TypeScript test
        run: node scripts/run-test-suite.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
