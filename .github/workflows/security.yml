name: Repository Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject tracked sensitive files
        run: npm run security:tracked

      - name: Scan worktree and reachable history
        run: npm run security:secrets

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build
